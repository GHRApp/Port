<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Gustavo Henrique</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="desktop">
        <div id="terminal-window">
            <div id="terminal-titlebar">
                <span class="title">gustavo@henrique: ~</span>
            </div>
            <div id="terminal-body">
                <div id="terminal-history"></div>
                <div id="terminal-prompt-line">
                    <span class="prompt-user">gustavo@debian</span><span class="prompt-separator">:</span><span class="prompt-dir">~$</span>
                    <span id="terminal-typing"></span><span class="cursor">_</span>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
